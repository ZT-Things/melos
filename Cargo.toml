[workspace]
resolver = "3"
members = [
  "crates/melos-proto",
  "crates/melos-daemon",
  "crates/melos-tui",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Fast, minimal TUI music player with YouTube downloads"
repository = "https://github.com/ZT-Things/melos"

[workspace.dependencies]
melos-proto = { path = "crates/melos-proto" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "process",
  "io-util",
  "sync",
  "time",
  "signal",
  "fs",
] }
anyhow = "1"
toml = "0.9"
libc = "0.2"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.43", default-features = false, features = ["cache"] }
lofty = "0.25"
ratatui = "0.30"
crossterm = "0.29"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
unicode-width = "0.2"
mpris-server = { version = "0.11", features = ["tokio"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
